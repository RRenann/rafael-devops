name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # Permissão para fazer checkout do código
      packages: write  # Permissão para FAZER PUSH de pacotes (imagem Docker)

    steps:
      # 1. Faz checkout do código
      - name: Checkout do Código
        uses: actions/checkout@v4

      # 2. Configura o Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Instala as dependências
      - name: Instalar Dependências
        run: npm install

      # 4. Roda os testes
      - name: Rodar Testes
        run: npm test

      # 5. Configura o Docker Buildx
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 6. Logar no GitHub Container Registry (GHCR)
      # Este step só roda se for um push na branch main
      - name: Logar no GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 7. Extrair metadados (tags) para o Docker
      # Este step só roda se for um push na branch main
      - name: Extrair Metadados do Docker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            latest

      # 8. Build E PUSH da Imagem Docker
      - name: Build e Push da Imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-to-local:
    # Este job SÓ RODA se for um push na 'main'
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # Ele precisa que o Job 1 (test-and-build) termine com sucesso
    needs: test-and-build

    # Ele roda no seu PC (onde o runner está ouvindo)
    runs-on: self-hosted

    steps:
      # 1. Pega o código (para ter o docker-compose.yml)
      - name: Checkout do Código
        uses: actions/checkout@v4

      # 2. Loga no GHCR (para poder BAIXAR a imagem)
      - name: Logar no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Executa o Deploy
      - name: Fazer Deploy com Docker Compose
        run: |
          docker-compose pull
          docker-compose up -d --no-build
          docker image prune -f